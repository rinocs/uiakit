name: Bug report
description: Report a reproducible problem using synthetic data.
body:
  - type: markdown
    attributes:
      value: Never include secrets or customer data. For vulnerabilities, follow SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include deployment profile and redacted errors.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
