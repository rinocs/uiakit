name: Functional Core
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: apps/gateway/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            apps/runtime/requirements*.txt
            packages/core/pyproject.toml
            packages/plugin-sdk/pyproject.toml
            plugins/examples/hello/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            packages/sdk-typescript/package-lock.json
            packages/chat-widget/package-lock.json
            apps/console/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - run: python -m pip install -r apps/runtime/requirements-dev.txt packages/core packages/plugin-sdk plugins/examples/hello
      - run: npm ci --prefix packages/sdk-typescript
      - run: npm ci --prefix packages/chat-widget
      - run: npm ci --prefix apps/console
      - run: composer install --working-dir=packages/sdk-php --no-interaction --no-progress
      - name: Core, contracts and security regression
        run: make test
      - run: make build-packages
      - run: cd apps/console && npx playwright install --with-deps chromium
      - run: make test-console-browser
      - run: make plugin-sdk-check plugin-sdk-build
      - run: make e2e
      - run: make e2e-upgrade
      - run: make e2e-two-instances
      - run: make e2e-restore
