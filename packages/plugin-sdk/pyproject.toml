[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uai-plugin-sdk"
version = "0.1.0"
description = "Trusted plugin and local skill contracts for Universal AI Kit"
requires-python = ">=3.12"
dependencies = ["uai-core>=0.1.0,<1", "pydantic>=2.14.1,<3", "packaging>=26.3,<27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uai_plugin_sdk = ["py.typed"]
